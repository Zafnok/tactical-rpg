[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
trpg-bots = { path = "../bots" }
trpg-content = { path = "../content" }
trpg-core = { path = "../core" }
# The Harness, for `frame-png` (ticket 0232).
trpg-ui = { path = "../ui", features = ["harness"] }
mutants = "0.0.4"
png = "0.17"
ron.workspace = true
serde.workspace = true
# The playtest report as JSON, and its history (ticket 0505).
serde_json = "1"
serde_norway = "0.9.42"

[features]
# `frame-png` renders the bought art (ADR-0040): never commit its output.
private-assets = ["trpg-content/private-assets"]
