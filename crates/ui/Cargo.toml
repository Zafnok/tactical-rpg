[package]
name = "trpg-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
trpg-core = { path = "../core" }
trpg-content = { path = "../content" }
thiserror.workspace = true

[features]
# The headless test `Harness` (src/harness.rs), for integration tests.
harness = []

[dev-dependencies]
# Turns on `harness` for this crate's own integration tests in tests/.
trpg-ui = { path = ".", features = ["harness"] }
proptest.workspace = true
insta.workspace = true

[package.metadata.cargo-machete]
# Crate-boundary scaffolding (ADR-0004): wired up by later tickets, not yet
# referenced from src.
ignored = ["trpg-core"]
