[package]
name = "trpg-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
trpg-core = { path = "../core" }
trpg-content = { path = "../content" }
thiserror.workspace = true

[features]
# The headless test `Harness` (src/harness.rs), for integration tests.
harness = []
# Debug tools (Quick Battle, glyph sampler) in a release build: the Pages
# build only (ADR-0023). Never on in shipped builds.
debug-tools = []

[dev-dependencies]
# Turns on `harness` for this crate's own integration tests in tests/.
trpg-ui = { path = ".", features = ["harness"] }
proptest.workspace = true
insta.workspace = true
