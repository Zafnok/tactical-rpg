[package]
name = "trpg-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

# The workspace lints (`[workspace.lints]` in the root Cargo.toml), copied
# because one differs and Cargo can't override a single inherited lint:
# `unsafe_code` is `deny` here instead of `forbid`, so the web build's
# controller plugin can declare the JS functions it imports
# (`src/pads/web.rs`, the only `#[allow(unsafe_code)]`; ADR-0034, and
# ADR-0004 rule 5: no `unsafe` outside `app`). An xtask test keeps the rest
# equal to the workspace's.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[[bin]]
name = "visions-of-shuyi"
path = "src/main.rs"

[features]
# Debug tools (Quick Battle, glyph sampler) in a release build: turned on only
# by the Pages build, `cargo xtask web --release --debug-tools` (ADR-0023).
# Never by release.yml, itch.io or Steam builds.
debug-tools = ["trpg-ui/debug-tools"]

[dependencies]
trpg-core = { path = "../core" }
trpg-content = { path = "../content" }
trpg-ui = { path = "../ui" }
macroquad.workspace = true

# Storage backend for web (ticket 0207): `localStorage`. Native resolves its
# data directory by hand (see storage/native.rs) rather than pulling in the
# `directories` crate, which drags in MPL-2.0 (denied by ADR-0013).
# Native music decodes on a worker thread into its own quad-snd context
# (ticket 0215, ADR-0028). The same version macroquad's `audio` feature uses.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quad-snd = "0.2.8"
# Controllers on Windows, Linux and macOS (ticket 0219, ADR-0034). The web
# build reads the browser's Gamepad API through `web/gamepad.js` instead.
gilrs = "0.11.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
quad-storage = "0.1"

[dev-dependencies]
# Turns on `harness` for `trpg-ui::storage::conformance_suite` in tests.
trpg-ui = { path = "../ui", features = ["harness"] }
tempfile = "3"
# Variant picking property test (audio.rs, ticket 0212).
proptest.workspace = true

[package.metadata.cargo-machete]
# Crate-boundary scaffolding (ADR-0004): wired up by later tickets, not yet
# referenced from src.
ignored = ["trpg-core"]
