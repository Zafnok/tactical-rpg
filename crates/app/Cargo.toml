[package]
name = "trpg-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "tactical-rpg"
path = "src/main.rs"

[features]
# Debug tools (Quick Battle, glyph sampler) in a release build: turned on only
# by the Pages build, `cargo xtask web --release --debug-tools` (ADR-0023).
# Never by release.yml, itch.io or Steam builds.
debug-tools = ["trpg-ui/debug-tools"]

[dependencies]
trpg-core = { path = "../core" }
trpg-content = { path = "../content" }
trpg-ui = { path = "../ui" }
macroquad.workspace = true

# Storage backend for web (ticket 0207): `localStorage`. Native resolves its
# data directory by hand (see storage/native.rs) rather than pulling in the
# `directories` crate, which drags in MPL-2.0 (denied by ADR-0013).
[target.'cfg(target_arch = "wasm32")'.dependencies]
quad-storage = "0.1"

[dev-dependencies]
# Turns on `harness` for `trpg-ui::storage::conformance_suite` in tests.
trpg-ui = { path = "../ui", features = ["harness"] }
tempfile = "3"
# Variant picking property test (audio.rs, ticket 0212).
proptest.workspace = true

[package.metadata.cargo-machete]
# Crate-boundary scaffolding (ADR-0004): wired up by later tickets, not yet
# referenced from src.
ignored = ["trpg-core"]
