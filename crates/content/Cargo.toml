[package]
name = "trpg-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Embeds the bought art in `assets-private/game/` over `assets/` (ADR-0040).
# Turned on only by builds that ship (Pages, release.yml) and by hand to look
# at the art; never by a gate, so tests always read the public placeholders.
private-assets = []

[dependencies]
trpg-core = { path = "../core" }
serde.workspace = true
ron.workspace = true
include_dir.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[package.metadata.cargo-machete]
# Crate-boundary scaffolding (ADR-0004): wired up by later tickets, not yet
# referenced from src.
ignored = []
