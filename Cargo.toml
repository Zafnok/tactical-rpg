[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license-file = "LICENSE"
repository = "https://github.com/Zafnok/visions-of-shuyi"

[workspace.dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
include_dir = "0.7"
thiserror = "2"
proptest = "1"
insta = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Less debug info in dev and test builds (ticket 0113; `test` inherits `dev`).
# On the GNU Windows toolchain the debug info is inside each `.exe`, and a
# `cargo test --workspace` links about 20 of them into every worktree's
# `target/`. Line tables are enough for panics and backtraces to name
# file:line; third-party crates get none. Sizes are in the ticket.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
