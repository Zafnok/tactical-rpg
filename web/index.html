<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tactical-rpg</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<script src="mq_js_bundle.js"></script>
<!-- Storage (0207): register the localStorage plugin before it's needed. -->
<script src="sapp_jsutils.js"></script>
<script src="quad-storage.js"></script>
<script>
  // Note: `mq_js_bundle.js` already declares a top-level `canvas` (and runs
  // in strict mode), so re-declaring it here — even as a plain `var` — would
  // throw and skip this whole script block. Use a different name.
  const glcanvas = document.getElementById("glcanvas");
  glcanvas.focus();
  glcanvas.addEventListener("click", () => glcanvas.focus());
  // mq_js_bundle.js's own key handler prevents default for the keys sokol
  // reports as arrows/space/tab; this listener is a backstop for anything it
  // doesn't cover (e.g. Firefox's Escape/PageUp/PageDown scroll behaviour).
  window.addEventListener("keydown", (event) => {
    const keys = [
      "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
      " ", "Tab", "PageUp", "PageDown", "Home", "End",
    ];
    if (keys.includes(event.key)) {
      event.preventDefault();
    }
  }, false);
  load("tactical-rpg.wasm");
</script>
</body>
</html>
