[default.extend-words]
# vim-style keys mentioned throughout design/UI docs.
hjkl = "hjkl"
# Project/tool names typos misreads as misspellings of other words.
ratatui = "ratatui"
# Fragments from hyphenated/compound tokens split across lines or by
# typos's identifier splitting (e.g. "CC-BY-ND", "mis-keys", "PNGs").
nd = "nd"
mis = "mis"
pn = "pn"
# Verbatim quote of Nick's spoken words in docs/design/magic.md; preserved
# as said, not a real typo to fix.
beginnning = "beginnning"

[files]
# Vendored third-party font data (hex bitmaps, codepoint names) and the atlas
# generated from it: not our prose, and never edited by hand.
extend-exclude = [
    "assets-src/fonts/*.bdf",
    "assets/fonts/atlas.ron",
    "assets/fonts/Terminus-LICENSE.txt",
    # Vendored macroquad JS loader (ticket 0206): minified third-party code,
    # never edited by hand.
    "web/mq_js_bundle.js",
]
